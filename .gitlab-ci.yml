stages:
  - test
  - pack
  - publish

default:
  image: node:22
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/

before_script:
  - |
    if [ -f package-lock.json ]; then
      npm ci --cache .npm --prefer-offline
    else
      npm install --cache .npm --prefer-offline
    fi

test:
  stage: test
  script:
    - node -e "const p=require('./package.json'); if (p.name !== 'air-core' || p.version !== '0.44.0' || p.license !== 'Apache-2.0' || !p.bin || p.bin.airc !== './bin/airc.js' || p.private === true) { console.error(p); process.exit(1) }"
    - npm test
    - npm run test:bundle
    - npm run check:public-package-surface
    - npm run check:public-claims
    - node scripts/check_markdown_links.js
    - git diff --check
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

pack:smoke:
  stage: pack
  script:
    - node -e "const p=require('./package.json'); if (p.name !== 'air-core' || p.version !== '0.44.0') { console.error(p); process.exit(1) }"
    - npm run check:public-package-surface
    - npm pack --dry-run --json > npm-pack-dry-run.json
    - npm pack
    - test -f air-core-0.44.0.tgz
    - mkdir -p /tmp/air-core-smoke
    - cd /tmp/air-core-smoke
    - npm init -y
    - npm install "$CI_PROJECT_DIR"/air-core-0.44.0.tgz
    - ./node_modules/.bin/airc version --json
    - ./node_modules/.bin/airc --help
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - npm-pack-dry-run.json
      - air-core-0.44.0.tgz
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

publish:npm:alpha:
  stage: publish
  needs:
    - job: test
    - job: pack:smoke
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG == "v0.44.0"'
      when: manual
    - when: never
  script:
    - test -n "$NPM_TOKEN"
    - node -e "const p=require('./package.json'); if (p.name !== 'air-core' || p.version !== '0.44.0') { console.error(p); process.exit(1) }"
    - npm run check:public-package-surface
    - npm pack --dry-run --json
    - printf '%s\n' "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
    - npm publish --access public --tag alpha
    - rm -f .npmrc
