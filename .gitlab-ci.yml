stages:
  - test
  - pack
  - verify
  - publish

default:
  image: node:22
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/

before_script:
  - |
    if [ -f package-lock.json ]; then
      npm ci --cache .npm --prefer-offline
    else
      npm install --cache .npm --prefer-offline
    fi

variables:
  AIR_NPM_DIST_TAG: "latest"
  AIR_NPM_EXPECTED_NAME: "@underskys/air-core"
  AIR_NPM_EXPECTED_VERSION: "0.50.0"
  AIR_NPM_EXPECTED_TAG: "v0.50.0"

test:
  stage: test
  script:
    - node -e "const p=require('./package.json'); if (p.name !== process.env.AIR_NPM_EXPECTED_NAME || p.version !== process.env.AIR_NPM_EXPECTED_VERSION || p.license !== 'Apache-2.0' || !p.bin || p.bin.airc !== 'bin/airc.js' || p.private === true) { console.error(p); process.exit(1) }"
    - npm test
    - npm run test:bundle
    - npm run check:public-package-surface
    - npm run check:public-claims
    - npm run check:review-bundle-policy
    - npm run check:repo-roles
    - npm run check:workspace-state
    - node scripts/check_markdown_links.js
    - node scripts/check_request_ledger.js
    - node scripts/check_abi_requests.js
    - node test/layer_guard.test.js
    - git diff --check
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

pack:smoke:
  stage: pack
  script:
    - node -e "const p=require('./package.json'); if (p.name !== process.env.AIR_NPM_EXPECTED_NAME || p.version !== process.env.AIR_NPM_EXPECTED_VERSION) { console.error(p); process.exit(1) }"
    - npm run check:public-package-surface
    - npm pack --dry-run --json > npm-pack-dry-run.json
    - npm pack --json > npm-pack.json
    - node -e "const fs=require('fs'); const pack=JSON.parse(fs.readFileSync('npm-pack.json','utf8'))[0]; fs.writeFileSync('npm-pack-file.txt', pack.filename)"
    - test -f "$(cat npm-pack-file.txt)"
    - mkdir -p /tmp/air-core-smoke
    - cd /tmp/air-core-smoke
    - npm init -y
    - npm install "$CI_PROJECT_DIR/$(cat "$CI_PROJECT_DIR/npm-pack-file.txt")"
    - ./node_modules/.bin/airc version --json
    - ./node_modules/.bin/airc --help
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - npm-pack-dry-run.json
      - npm-pack.json
      - npm-pack-file.txt
      - "*.tgz"
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

npm:auth:check:
  stage: verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - if: '$CI_COMMIT_TAG'
      when: manual
    - when: never
  script:
    - bash scripts/ci_npm_auth_check.sh

publish:npm:
  stage: publish
  needs:
    - job: test
    - job: pack:smoke
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG == "v0.50.0"'
      when: manual
    - when: never
  script:
    - bash scripts/ci_npm_publish.sh

npm:dist-tag:
  stage: publish
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $AIR_NPM_DIST_TAG_UPDATE == "1"'
      when: manual
    - when: never
  script:
    - bash scripts/ci_npm_dist_tag.sh
