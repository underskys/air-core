stages:
  - test
  - pack
  - verify
  - publish

default:
  image: node:22
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/

before_script:
  - |
    if [ -f package-lock.json ]; then
      npm ci --cache .npm --prefer-offline
    else
      npm install --cache .npm --prefer-offline
    fi
  - npx playwright install --with-deps chromium

variables:
  AIR_NPM_DIST_TAG: "latest"
  AIR_NPM_EXPECTED_NAME: "@underskys/air-core"
  AIR_NPM_EXPECTED_VERSION: "0.52.1"
  AIR_NPM_EXPECTED_TAG: "v0.52.1"

test:
  stage: test
  script:
    - node -e "const p=require('./package.json'); if (p.name !== process.env.AIR_NPM_EXPECTED_NAME || p.version !== process.env.AIR_NPM_EXPECTED_VERSION || p.license !== 'Apache-2.0' || !p.bin || p.bin.airc !== 'bin/airc.js' || p.private === true) { console.error(p); process.exit(1) }"
    - |
      set -e
      WASMTIME_VERSION=44.0.1
      WASMTIME_ARCHIVE="wasmtime-v${WASMTIME_VERSION}-x86_64-linux"
      WASMTIME_SHA256=afd58715f105e3a7f454169daed22168c5736ec5f225fb04c4ac62c54c9508a3
      WASMTIME_TMP="$(mktemp -d "${TMPDIR:-/tmp}/wasmtime.XXXXXX")"
      curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --output "$WASMTIME_TMP/$WASMTIME_ARCHIVE.tar.xz" "https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/$WASMTIME_ARCHIVE.tar.xz"
      echo "$WASMTIME_SHA256  $WASMTIME_TMP/$WASMTIME_ARCHIVE.tar.xz" | sha256sum -c -
      tar -xJf "$WASMTIME_TMP/$WASMTIME_ARCHIVE.tar.xz" -C "$WASMTIME_TMP"
      install -m 0755 "$WASMTIME_TMP/$WASMTIME_ARCHIVE/wasmtime" /usr/local/bin/wasmtime
      rm -rf "$WASMTIME_TMP"
      test "$(wasmtime --version | cut -d' ' -f2)" = "$WASMTIME_VERSION"
    - npm test
    - npm run test:bundle
    - npm run check:public-package-surface
    - npm run check:public-claims
    - npm run check:review-bundle-policy
    - npm run check:repo-roles
    - npm run check:workspace-state
    - node scripts/check_markdown_links.js
    - node scripts/check_request_ledger.js
    - node scripts/check_abi_requests.js
    - node test/layer_guard.test.js
    - git diff --check
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

pack:smoke:
  stage: pack
  script:
    - node -e "const p=require('./package.json'); if (p.name !== process.env.AIR_NPM_EXPECTED_NAME || p.version !== process.env.AIR_NPM_EXPECTED_VERSION) { console.error(p); process.exit(1) }"
    - npm run check:public-package-surface
    - npm pack --dry-run --json > npm-pack-dry-run.json
    - npm pack --json > npm-pack.json
    - node -e "const fs=require('fs'); const pack=JSON.parse(fs.readFileSync('npm-pack.json','utf8'))[0]; fs.writeFileSync('npm-pack-file.txt', pack.filename)"
    - test -f "$(cat npm-pack-file.txt)"
    - mkdir -p /tmp/air-core-smoke
    - cd /tmp/air-core-smoke
    - npm init -y
    - npm install "$CI_PROJECT_DIR/$(cat "$CI_PROJECT_DIR/npm-pack-file.txt")"
    - ./node_modules/.bin/airc version --json
    - ./node_modules/.bin/airc --help
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - npm-pack-dry-run.json
      - npm-pack.json
      - npm-pack-file.txt
      - "*.tgz"
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

npm:auth:check:
  stage: verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - if: '$CI_COMMIT_TAG'
      when: manual
    - when: never
  script:
    - bash scripts/ci_npm_auth_check.sh

publish:npm:
  stage: publish
  needs:
    - job: test
    - job: pack:smoke
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG == "v0.52.1"'
      when: manual
    - when: never
  script:
    - bash scripts/ci_npm_publish.sh

npm:dist-tag:
  stage: publish
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $AIR_NPM_DIST_TAG_UPDATE == "1"'
      when: manual
    - when: never
  script:
    - bash scripts/ci_npm_dist_tag.sh
